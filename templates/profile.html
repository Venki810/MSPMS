{% extends 'base.html' %}
{% block title %}My profile{% endblock %}
{% block content %}
<div class="card" style="max-width:640px"><div class="card-header">Profile and password</div>
<form method="post" class="card-body vstack gap-3 needs-validation" novalidate>{{ csrf_input() }}
  <div class="row g-3"><div class="col-sm-6"><label class="form-label">User ID</label><input class="form-control" value="{{ g.user.username }}" disabled></div>
    <div class="col-sm-6"><label class="form-label">Role</label><input class="form-control" value="{{ g.user.role }}" disabled></div></div>
  <div class="row g-3"><div class="col-sm-6"><label class="form-label">Full name</label><input class="form-control" name="full_name" value="{{ g.user.full_name }}" required></div>
    <div class="col-sm-6"><label class="form-label">Email</label><input type="email" class="form-control" name="email" value="{{ g.user.email or '' }}"></div></div>
  <hr class="my-1"><div class="small text-muted">Leave the password fields empty to keep your current password.</div>
  <div class="row g-3"><div class="col-sm-4"><label class="form-label">Current password</label><input type="password" class="form-control" name="current_password" autocomplete="current-password"></div>
    <div class="col-sm-4"><label class="form-label">New password</label><input type="password" class="form-control" name="new_password" minlength="6" autocomplete="new-password"></div>
    <div class="col-sm-4"><label class="form-label">Confirm new</label><input type="password" class="form-control" name="confirm" autocomplete="new-password"></div></div>
  <div><button class="btn btn-primary">Save changes</button></div>
</form></div>
{% endblock %}
