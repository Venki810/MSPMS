{% extends 'base.html' %}
{% block title %}New sale / bill{% endblock %}
{% block content %}
<form method="post" id="saleForm" data-preload="{{ preload }}" class="needs-validation" novalidate>{{ csrf_input() }}
<div class="row g-3">
  <div class="col-lg-8"><div class="card"><div class="card-header">Bill items</div><div class="card-body">
    <div class="row g-2 mb-3">
      <div class="col-md-7 position-relative"><label class="form-label small mb-1">Search part (name / part no)</label><input class="form-control" id="partSearch" autocomplete="off" placeholder="Start typing..."><div class="search-drop" id="partDrop"></div></div>
      <div class="col-md-5"><label class="form-label small mb-1">Scan barcode (press Enter)</label><div class="input-group"><span class="input-group-text"><i class="bi bi-upc-scan"></i></span><input class="form-control" id="barcodeIn" autocomplete="off"></div></div></div>
    <div class="table-responsive"><table class="table"><thead><tr><th>Part</th><th class="text-end">Price</th><th>Qty</th><th class="text-end">GST</th><th class="text-end">Amount</th><th></th></tr></thead><tbody id="cartBody"></tbody></table></div>
  </div></div></div>
  <div class="col-lg-4 vstack gap-3">
    <div class="card"><div class="card-header">Customer and store</div><div class="card-body vstack gap-3">
      <div><label class="form-label">Customer</label><select class="form-select" name="customer_id"><option value="">Walk-in customer</option>{% for c in customers %}<option value="{{ c.id }}" {{ 'selected' if cust_id|string == c.id|string }}>{{ c.name }} {{ '(' ~ c.phone ~ ')' if c.phone }}</option>{% endfor %}</select></div>
      <div><label class="form-label">Sell from *</label><select class="form-select" name="location_id" id="location_id" required>{% for l in locations %}<option value="{{ l.id }}">{{ l.name }}</option>{% endfor %}</select></div></div></div>
    <div class="card"><div class="card-header">Totals and payment</div><div class="card-body vstack gap-3">
      <div class="input-group"><span class="input-group-text">Discount</span><input type="number" min="0" step="0.01" class="form-control" name="discount" id="discount" value="0"><select class="form-select" name="discount_type" id="discount_type" style="max-width:80px"><option value="amount">Rs</option><option value="percent">%</option></select></div>
      <dl class="totals-box row mb-0"><dt class="col-6">Subtotal</dt><dd class="col-6" id="t_sub">-</dd><dt class="col-6">Discount</dt><dd class="col-6" id="t_disc">-</dd><dt class="col-6">GST</dt><dd class="col-6" id="t_gst">-</dd>
        <dt class="col-6 pt-2 border-top">Total</dt><dd class="col-6 pt-2 border-top grand" id="t_total">-</dd></dl>
      <div class="row g-2"><div class="col-6"><label class="form-label">Payment mode</label><select class="form-select" name="payment_mode" id="payment_mode"><option>Cash</option><option>UPI</option><option>Card</option><option>Credit</option></select></div>
        <div class="col-6"><label class="form-label">Amount received</label><input type="number" min="0" step="0.01" class="form-control" name="paid_amount" id="paid_amount"></div></div>
      <button class="btn btn-primary btn-lg"><i class="bi bi-check2-circle me-1"></i>Generate invoice</button></div></div>
  </div>
</div></form>
{% endblock %}
{% block scripts %}<script src="{{ url_for('static', filename='js/pos.js') }}"></script>{% endblock %}
